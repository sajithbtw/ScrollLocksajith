name: Build ScrollLock APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses and ensure SDK 36 packages
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" || true
          "$SDKMANAGER" "platforms;android-36.1" || "$SDKMANAGER" "platforms;android-36" || true

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug -Dorg.gradle.jvmargs="-Xmx3g" --no-daemon

      - name: Upload ScrollLock Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScrollLock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
